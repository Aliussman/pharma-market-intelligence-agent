[project]
name = "pharma-market-intelligence-agent"
version = "0.1.0"
description = "AI-powered market intelligence system for pharma earnings and pipeline analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "groq",
    "python-dotenv",
    "pydantic",
    "fpdf2",
    "streamlit",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "black",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true